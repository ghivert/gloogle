name: test

on:
  push:
    branches:
      - main
  pull_request:

env:
  OTP_VERSION: '28'
  GLEAM_VERSION: '1.19.2'
  REBAR3_VERSION: '3'
  NODE_VERSION: '24'

jobs:
  jupiter:
    name: jupiter
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: gloogle
          POSTGRES_USER: gloogle
          POSTGRES_DB: gloogle
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: apps/jupiter
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}
      - name: Load the schema
        # The schema is dumped by pg_dump 18; load it with a matching psql.
        run: >-
          docker run --rm --network host
          -v "$PWD/db/schema.sql:/schema.sql:ro"
          -e PGPASSWORD=gloogle
          postgres:18
          psql -v ON_ERROR_STOP=1 -h localhost -U gloogle -d gloogle -f /schema.sql
      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam test
        env:
          POSTGRES_HOST: localhost

  erlang-packages:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [packages/galaxy, packages/plasma, packages/chomp]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}
      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam test

  javascript-packages:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [apps/venus, packages/vitools]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam test
